<title>Planning Apply Queue</title>
<style>
:root{
  --ground:#EAEEF2; --surface:#FFFFFF; --surface-2:#F4F7F9;
  --ink:#0F161C; --muted:#5B6875; --hair:#D3DBE3;
  --accent:#0E6B61; --accent-soft:#DCEEEB;
  --a:#9A5B00; --a-soft:#FBEAD2;
  --b:#33556F; --b-soft:#DFE8F0;
  --c:#6B7883; --c-soft:#E6EAEE;
  --done:#3F7A46; --warn:#8A4B00; --warn-soft:#FBEAD2;
  --shadow:0 1px 2px rgba(15,22,28,.06),0 4px 14px rgba(15,22,28,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0B1116; --surface:#141C23; --surface-2:#101820;
    --ink:#E4EAF0; --muted:#96A3B0; --hair:#26313B;
    --accent:#4FD1C0; --accent-soft:#123832;
    --a:#E9A94A; --a-soft:#3A2C13;
    --b:#8FB4D4; --b-soft:#1A2A38;
    --c:#93A0AC; --c-soft:#1E262E;
    --done:#7BC088; --warn:#E9A94A; --warn-soft:#3A2C13;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --ground:#0B1116; --surface:#141C23; --surface-2:#101820;
  --ink:#E4EAF0; --muted:#96A3B0; --hair:#26313B;
  --accent:#4FD1C0; --accent-soft:#123832;
  --a:#E9A94A; --a-soft:#3A2C13;
  --b:#8FB4D4; --b-soft:#1A2A38;
  --c:#93A0AC; --c-soft:#1E262E;
  --done:#7BC088; --warn:#E9A94A; --warn-soft:#3A2C13;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums}
.wrap{max-width:1080px; margin:0 auto; padding:0 20px 72px}

/* ---- masthead ---- */
header.top{
  background:var(--surface); border-bottom:1px solid var(--hair);
  padding:26px 0 0;
}
.head-in{max-width:1080px;margin:0 auto;padding:0 20px}
h1{
  margin:0; font-size:clamp(22px,3.4vw,30px); font-weight:680;
  letter-spacing:-.022em; text-wrap:balance;
}
.sub{margin:5px 0 0; color:var(--muted); font-size:13.5px}
.stamp{font-size:12px; color:var(--muted); margin-top:2px}

/* ---- funnel strip ---- */
.funnel{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px; background:var(--hair); border:1px solid var(--hair);
  border-radius:9px; overflow:hidden; margin:20px 0 22px;
}
.fcell{background:var(--surface); padding:11px 13px}
.fcell .n{font-size:21px; font-weight:660; letter-spacing:-.02em; display:block}
.fcell .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.075em;
  color:var(--muted); margin-top:1px; display:block}
.fcell.hot .n{color:var(--a)}
.fcell.good .n{color:var(--done)}

/* ---- controls ---- */
.bar{
  display:flex; flex-wrap:wrap; gap:7px; align-items:center;
  padding:14px 0 16px; position:sticky; top:0; z-index:5;
  background:var(--ground); border-bottom:1px solid var(--hair); margin-bottom:16px;
}
.chip{
  font:inherit; font-size:12.5px; padding:5px 11px; border-radius:999px; cursor:pointer;
  border:1px solid var(--hair); background:var(--surface); color:var(--muted);
  transition:background .12s,color .12s,border-color .12s;
}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:560}
:root[data-theme="dark"] .chip[aria-pressed="true"],
.chip[aria-pressed="true"]{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#08110F}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#08110F}
.chip:focus-visible,.act:focus-visible,.tick:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.spacer{flex:1 1 auto; min-width:8px}
.count{font-size:12.5px; color:var(--muted)}

/* ---- job rows ---- */
ol.queue{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
li.job{
  background:var(--surface); border:1px solid var(--hair); border-radius:9px;
  box-shadow:var(--shadow); display:grid; grid-template-columns:4px 1fr auto;
  overflow:hidden; align-items:stretch;
}
.stripe{background:var(--c)}
.job[data-tier="A"] .stripe{background:var(--a)}
.job[data-tier="B"] .stripe{background:var(--b)}
.job.is-done{opacity:.5}
.job.is-done .stripe{background:var(--done)}
.body{padding:12px 14px; min-width:0}
.row1{display:flex; flex-wrap:wrap; gap:7px; align-items:baseline}
.t{font-weight:610; font-size:15.5px; letter-spacing:-.011em}
.co{color:var(--muted); font-size:14px}
.co b{color:var(--ink); font-weight:600}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; align-items:center}
.tag{
  font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; font-weight:600;
  padding:2.5px 7px; border-radius:4px; background:var(--c-soft); color:var(--c);
}
.job[data-tier="A"] .tag.tier{background:var(--a-soft); color:var(--a)}
.job[data-tier="B"] .tag.tier{background:var(--b-soft); color:var(--b)}
.tag.prem{background:var(--accent-soft); color:var(--accent)}
/* Effort, not platform: green means minutes, amber means a full ATS form. */
.tag.route[data-eff="quick"]{background:var(--accent-soft); color:var(--done)}
.tag.route[data-eff="form"]{background:var(--warn-soft); color:var(--warn)}
.tag.route[data-eff="unknown"]{background:var(--c-soft); color:var(--c)}
.loc{font-size:12.5px; color:var(--muted)}
.why{margin:7px 0 0; font-size:12px; color:var(--muted); line-height:1.45}
.side{
  display:flex; flex-direction:column; gap:6px; justify-content:center;
  padding:12px 14px 12px 8px; border-left:1px solid var(--hair); background:var(--surface-2);
}
.score{text-align:right; font-size:19px; font-weight:660; letter-spacing:-.02em; line-height:1}
.score span{display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); font-weight:500; margin-top:3px}
.act{
  display:inline-block; text-align:center; text-decoration:none; white-space:nowrap;
  font-size:13px; font-weight:590; padding:7px 15px; border-radius:6px;
  background:var(--accent); color:#fff; border:1px solid transparent;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .act{color:#08110F}}
:root[data-theme="dark"] .act{color:#08110F}
.act:hover{filter:brightness(1.08)}
.tick{
  font:inherit; font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer;
  background:transparent; border:1px solid var(--hair); color:var(--muted);
}
.tick:hover{border-color:var(--done); color:var(--done)}
.job.is-done .tick{border-color:var(--done); color:var(--done); font-weight:560}
.empty{padding:44px 8px; text-align:center; color:var(--muted); font-size:14px}

footer{margin-top:26px; padding-top:16px; border-top:1px solid var(--hair);
  color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center}

@media (max-width:640px){
  li.job{grid-template-columns:4px 1fr}
  .side{border-left:0; border-top:1px solid var(--hair); grid-column:2;
    flex-direction:row; align-items:center; justify-content:space-between; padding:9px 14px}
  .score{display:flex; align-items:baseline; gap:6px; font-size:16px}
  .score span{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<header class="top">
  <div class="head-in">
    <h1>Planning Apply Queue</h1>
    <p class="sub">Tier A/B/C roles the engine scored but could not auto-apply to &mdash; these need one tap each.</p>
    <p class="stamp mono" id="stamp"></p>
    <div class="funnel" id="funnel"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <button class="chip" data-f="tier" data-v="A" aria-pressed="true">Tier A</button>
    <button class="chip" data-f="tier" data-v="B" aria-pressed="true">Tier B</button>
    <button class="chip" data-f="tier" data-v="C" aria-pressed="false">Tier C</button>
    <button class="chip" data-f="prem" data-v="1" aria-pressed="false">Premium only</button>
    <button class="chip" data-f="quick" data-v="1" aria-pressed="false">Quick applies</button>
    <button class="chip" data-f="hide" data-v="1" aria-pressed="true">Hide done</button>
    <span class="spacer"></span>
    <span class="count mono" id="count"></span>
  </div>
  <ol class="queue" id="queue"></ol>
  <footer>
    <span id="progress" class="mono"></span>
    <span class="spacer"></span>
    <button class="tick" id="copy">Copy done IDs</button>
    <button class="tick" id="reset">Reset ticks</button>
  </footer>
</div>

ation P3 (+10)", "Fresh (6d old) (+5)"], "status": "new", "done": false, "route": "Bayt quick-apply"}, {"id": "d5f90d433dd215f6", "title": "UAE Oil & Gas Tank Construction Jobs 2026 | Planning, Estimation, Project & Construction Management", "company": "", "location": "Gulf / GCC", "url": "https://www.gulfjobpaper.com/oil-gas-tank-construction-jobs-uae/", "source": "GulfJobPaper", "posted": "2026-08-21", "score": 41, "tier": "C", "geo": "unknown", "premium": 0, "why": ["Planning role (+8)", "Skills: primavera p6, primavera, p6, project controls, scheduling (+20)", "Sector: oil & gas, construction (+6)", "Location UNKNOWN (+1)", "Fresh (3d old) (+6)"], "status": "new", "done": false, "route": "Employer site"}, {"id": "1d1c6ff2dbd6ebd9", "title": "Senior Planning Engineer", "company": "Gulftek Arabia", "location": "Dammam - Saudi Arabia", "url": "https://www.naukrigulf.com/senior-planning-engineer-jobs-in-dammam-saudi-arabia-in-gulftek-arabia-5-to-10-years-n-cd-164621-jid-020726000201", "source": "Naukrigulf", "posted": "", "score": 40, "tier": "C", "geo": "p1", "premium": 0, "why": ["Senior level (+14)", "Skills: delay analysis (+4)", "Location P1 (+22)"], "status": "new", "done": false, "route": "NaukriGulf quick-apply"}, {"id": "767016ab38ecb9fc", "title": "Planning Engineer", "company": "Client of Tawzef", "location": "Riyadh - Saudi Arabia", "url": "https://www.naukrigulf.com/planning-engineer-jobs-in-riyadh-saudi-arabia-in-client-of-tawzef-5-to-30-years-n-cd-10051810-jid-070726501234", "source": "Naukrigulf", "posted": "", "score": 40, "tier": "C", "geo": "p3", "premium": 0, "why": ["Planning role (+8)", "Skills: primavera p6, primavera, p6, earned value, baseline (+22)", "Location P3 (+10)"], "status": "new", "done": false, "route": "NaukriGulf quick-apply"}, {"id": "49d9369f572ad025", "title": "Assistant Manager - Finance Planning & Analysis", "company": "Almosafer", "location": "Riyadh - Saudi Arabia", "url": "https://www.naukrigulf.com/assistant-manager-finance-planning-analysis-jobs-in-riyadh-saudi-arabia-in-almosafer-5-to-7-years-n-cd-40001351-jid-030726500681", "source": "Naukrigulf", "posted": "", "score": 40, "tier": "C", "geo": "p3", "premium": 0, "why": ["Manager-level title (+30)", "Location P3 (+10)"], "status": "new", "done": false, "route": "NaukriGulf quick-apply"}], "totals": {"all": 2112}}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById("payload").textContent);
  var JOBS = DATA.jobs, KEY = "jobhunt.applied.v1";

  var ticked = {};
  try { ticked = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { ticked = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(ticked)); } catch (e) {} }
  function isDone(j){ return !!ticked[j.id] || j.done; }

  var filt = { tier:{A:true,B:true,C:false}, prem:false, hide:true, quick:false };

  // LinkedIn will not tell a logged-out visitor whether a posting is Easy
  // Apply, so "quick" here means the destination is a board profile-apply or
  // a plain email - not a full employer ATS form.
  function effortOf(route){
    if (/quick-apply|Email the ad/.test(route)) return "quick";
    if (/form/.test(route)) return "form";
    return "unknown";
  }

  var qEl = document.getElementById("queue");
  var cEl = document.getElementById("count");
  var pEl = document.getElementById("progress");

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }

  function visible(){
    return JOBS.filter(function(j){
      if (!filt.tier[j.tier]) return false;
      if (filt.prem && !j.premium) return false;
      if (filt.quick && effortOf(j.route) !== "quick") return false;
      if (filt.hide && isDone(j)) return false;
      return true;
    });
  }

  function buildFunnel(){
    var a = JOBS.filter(function(j){ return j.tier === "A"; }).length;
    var b = JOBS.filter(function(j){ return j.tier === "B"; }).length;
    var c = JOBS.filter(function(j){ return j.tier === "C"; }).length;
    var done = JOBS.filter(isDone).length;
    var cells = [
      ["", DATA.totals.all, "scraped"],
      ["hot", a, "tier A"],
      ["", b, "tier B"],
      ["", c, "tier C"],
      ["good", done, "actioned"],
      ["hot", JOBS.length - done, "still open"]
    ];
    document.getElementById("funnel").innerHTML = cells.map(function(k){
      return '<div class="fcell ' + k[0] + '"><span class="n mono">' + k[1] +
             '</span><span class="l">' + k[2] + "</span></div>";
    }).join("");
  }

  function render(){
    var list = visible();
    cEl.textContent = list.length + " shown";
    var done = JOBS.filter(isDone).length;
    pEl.textContent = done + " / " + JOBS.length + " actioned";

    if (!list.length){
      qEl.innerHTML = '<li class="empty">Nothing matches these filters. Widen the tiers, or untick &ldquo;Hide done&rdquo;.</li>';
      buildFunnel();
      return;
    }

    qEl.innerHTML = list.map(function(j){
      var why = (j.why || []).slice(0, 3).join(" &middot; ");
      var loc = j.location ? esc(j.location) : "Location not stated";
      return '<li class="job' + (isDone(j) ? " is-done" : "") + '" data-tier="' + esc(j.tier) + '">' +
        '<div class="stripe"></div>' +
        '<div class="body">' +
          '<div class="row1"><span class="t">' + esc(j.title) + '</span>' +
          '<span class="co">at <b>' + esc(j.company || "Unnamed employer") + "</b></span></div>" +
          '<div class="meta">' +
            '<span class="tag tier">Tier ' + esc(j.tier) + "</span>" +
            (j.premium ? '<span class="tag prem">Premium</span>' : "") +
            '<span class="tag route" data-eff="' + effortOf(j.route) + '">' + esc(j.route) + "</span>" +
            '<span class="loc">' + loc + (j.posted ? " &middot; posted " + esc(j.posted) : "") + "</span>" +
          "</div>" +
          (why ? '<p class="why">' + esc(why).replace(/&amp;middot;/g, "&middot;") + "</p>" : "") +
        "</div>" +
        '<div class="side">' +
          '<div class="score mono">' + (j.score || 0) + "<span>score</span></div>" +
          '<a class="act" href="' + esc(j.url) + '" target="_blank" rel="noopener noreferrer">Open &amp; apply</a>' +
          '<button class="tick" data-id="' + esc(j.id) + '">' +
            (isDone(j) ? "&#10003; Applied" : "Mark applied") + "</button>" +
        "</div>" +
      "</li>";
    }).join("");
    buildFunnel();
  }

  qEl.addEventListener("click", function(ev){
    var btn = ev.target.closest(".tick");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (ticked[id]) { delete ticked[id]; } else { ticked[id] = new Date().toISOString().slice(0,10); }
    save(); render();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".bar .chip"), function(ch){
    ch.addEventListener("click", function(){
      var on = ch.getAttribute("aria-pressed") !== "true";
      ch.setAttribute("aria-pressed", on ? "true" : "false");
      var f = ch.getAttribute("data-f"), v = ch.getAttribute("data-v");
      if (f === "tier") { filt.tier[v] = on; }
      else if (f === "prem") { filt.prem = on; }
      else if (f === "quick") { filt.quick = on; }
      else { filt.hide = on; }
      render();
    });
  });

  document.getElementById("copy").addEventListener("click", function(){
    var ids = Object.keys(ticked);
    var txt = ids.length ? ids.join("\n") : "(none ticked yet)";
    var btn = this;
    function done(ok){ btn.textContent = ok ? "✓ Copied" : "Copy failed";
      setTimeout(function(){ btn.textContent = "Copy done IDs"; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); });
    } else { done(false); }
  });

  document.getElementById("reset").addEventListener("click", function(){
    ticked = {}; save(); render();
    this.textContent = "✓ Cleared";
    var b = this; setTimeout(function(){ b.textContent = "Reset ticks"; }, 1600);
  });

  document.getElementById("stamp").textContent =
    "Snapshot " + DATA.generated + "  ·  " + JOBS.length + " scored roles  ·  ticks saved on this device only";

  render();
})();
</script>
